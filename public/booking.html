<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      transition: direction 0.3s;
    }

    body[dir="rtl"] {
      font-family: 'Arial', 'Segoe UI', sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      position: relative;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 40px;
      text-align: center;
      position: relative;
    }

    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    [dir="rtl"] .lang-switcher {
      right: auto;
      left: 20px;
    }

    .lang-switcher:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 40px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e0e0e0;
      transition: all 0.3s;
    }

    .step-dot.active {
      background: #667eea;
      transform: scale(1.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    label .required {
      color: #e74c3c;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .date-picker-container {
      max-width: 400px;
      margin: 0 auto;
    }

    .calendar-info {
      text-align: center;
      color: #666;
      margin-top: 15px;
      font-size: 14px;
    }

    .slots-container {
      margin-top: 30px;
    }

    .slots-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .slots-header h3 {
      color: #333;
      margin-bottom: 5px;
    }

    .slots-date {
      color: #667eea;
      font-size: 16px;
      font-weight: 600;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .slot-button {
      padding: 12px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .slot-button:hover {
      border-color: #667eea;
      background: #f0f4ff;
      transform: translateY(-2px);
    }

    .slot-button.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .no-slots {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .no-slots-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    [dir="rtl"] .button-group {
      flex-direction: row-reverse;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .summary {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .summary h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .summary-label {
      color: #666;
      font-weight: 500;
    }

    .summary-value {
      color: #333;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .content {
        padding: 20px;
      }

      .slots-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
    }
  </style>
</head>
<body dir="ltr">
  <div class="container">
    <div class="header">
      <div class="lang-switcher" onclick="toggleLanguage()">
        <span id="langIcon">🌐</span>
        <span id="langText">עברית</span>
      </div>
      <h1 id="headerTitle">📅 Book an Appointment</h1>
      <p id="headerSubtitle">Select a date and time that works for you</p>
    </div>

    <div class="content">
      <div class="step-indicator">
        <div class="step-dot active" data-step="1"></div>
        <div class="step-dot" data-step="2"></div>
        <div class="step-dot" data-step="3"></div>
      </div>

      <div id="message" class="message"></div>

      <!-- Step 1: Service Selection -->
      <div class="step active" id="step1">
        <div class="form-group">
          <label for="service_type"><span id="labelService">Select Service</span> <span class="required">*</span></label>
          <select id="service_type" name="service_type" required>
            <option value="" data-lang-key="chooseService">Choose a service...</option>
            <option value="Therapy Session">💬 <span data-lang-key="therapySession">Therapy Session</span> (60 min)</option>
            <option value="Consultation">🗣️ <span data-lang-key="consultation">Consultation</span> (30 min)</option>
            <option value="Haircut">✂️ <span data-lang-key="haircut">Haircut</span> (45 min)</option>
            <option value="Hair Styling">💇 <span data-lang-key="hairStyling">Hair Styling</span> (60 min)</option>
            <option value="Facial Treatment">✨ <span data-lang-key="facialTreatment">Facial Treatment</span> (60 min)</option>
            <option value="Massage">💆 <span data-lang-key="massage">Massage</span> (90 min)</option>
            <option value="Manicure">💅 <span data-lang-key="manicure">Manicure</span> (45 min)</option>
            <option value="Pedicure">🦶 <span data-lang-key="pedicure">Pedicure</span> (60 min)</option>
            <option value="Makeup">💄 <span data-lang-key="makeup">Makeup</span> (45 min)</option>
            <option value="Other">📋 <span data-lang-key="other">Other</span> (60 min)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="duration"><span id="labelDuration">Duration (minutes)</span> <span class="required">*</span></label>
          <select id="duration" name="duration" required>
            <option value="30">30 <span data-lang-key="minutes">minutes</span></option>
            <option value="45">45 <span data-lang-key="minutes">minutes</span></option>
            <option value="60" selected>60 <span data-lang-key="minutes">minutes</span></option>
            <option value="90">90 <span data-lang-key="minutes">minutes</span></option>
            <option value="120">120 <span data-lang-key="minutes">minutes</span></option>
          </select>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-primary" onclick="goToStep(2)" id="btnStep1Next">Next: Select Date & Time</button>
        </div>
      </div>

      <!-- Step 2: Date & Time Selection -->
      <div class="step" id="step2">
        <div class="date-picker-container">
          <div class="form-group">
            <label for="requested_date"><span id="labelDate">Select Date</span> <span class="required">*</span></label>
            <input type="date" id="requested_date" name="requested_date" required onchange="loadAvailableSlots()">
            <p class="calendar-info" id="calendarInfo">Select a date to see available time slots</p>
          </div>
        </div>

        <div class="slots-container" id="slotsContainer" style="display: none;">
          <div class="slots-header">
            <h3 id="availableTimesHeader">Available Times</h3>
            <p class="slots-date" id="selectedDate"></p>
          </div>
          <div id="slotsContent">
            <!-- Slots will be loaded here -->
          </div>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="goToStep(1)" id="btnStep2Back">Back</button>
          <button type="button" class="btn btn-primary" id="btnNext2" onclick="goToStep(3)" disabled>Next: Your Details</button>
        </div>
      </div>

      <!-- Step 3: Personal Information -->
      <div class="step" id="step3">
        <div class="summary">
          <h3 id="summaryTitle">Appointment Summary</h3>
          <div class="summary-item">
            <span class="summary-label" id="summaryLabelService">Service:</span>
            <span class="summary-value" id="summaryService">-</span>
          </div>
          <div class="summary-item">
            <span class="summary-label" id="summaryLabelDate">Date:</span>
            <span class="summary-value" id="summaryDate">-</span>
          </div>
          <div class="summary-item">
            <span class="summary-label" id="summaryLabelTime">Time:</span>
            <span class="summary-value" id="summaryTime">-</span>
          </div>
          <div class="summary-item">
            <span class="summary-label" id="summaryLabelDuration">Duration:</span>
            <span class="summary-value" id="summaryDuration">-</span>
          </div>
        </div>

        <div class="form-group">
          <label for="client_name"><span id="labelName">Full Name</span> <span class="required">*</span></label>
          <input type="text" id="client_name" name="client_name" required data-placeholder-key="namePlaceholder">
        </div>

        <div class="form-group">
          <label for="client_email"><span id="labelEmail">Email</span> <span class="required">*</span></label>
          <input type="email" id="client_email" name="client_email" required data-placeholder-key="emailPlaceholder">
        </div>

        <div class="form-group">
          <label for="client_phone" id="labelPhone">Phone Number</label>
          <input type="tel" id="client_phone" name="client_phone" data-placeholder-key="phonePlaceholder">
        </div>

        <div class="form-group">
          <label for="notes" id="labelNotes">Additional Notes</label>
          <textarea id="notes" name="notes" data-placeholder-key="notesPlaceholder"></textarea>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="goToStep(2)" id="btnStep3Back">Back</button>
          <button type="button" class="btn btn-primary" onclick="submitAppointment()" id="btnSubmit">Book Appointment</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Translations
    const translations = {
      en: {
        // Header
        headerTitle: '📅 Book an Appointment',
        headerSubtitle: 'Select a date and time that works for you',
        langText: 'עברית',

        // Step 1
        labelService: 'Select Service',
        labelDuration: 'Duration (minutes)',
        chooseService: 'Choose a service...',
        therapySession: 'Therapy Session',
        consultation: 'Consultation',
        haircut: 'Haircut',
        hairStyling: 'Hair Styling',
        facialTreatment: 'Facial Treatment',
        massage: 'Massage',
        manicure: 'Manicure',
        pedicure: 'Pedicure',
        makeup: 'Makeup',
        other: 'Other',
        minutes: 'minutes',
        btnStep1Next: 'Next: Select Date & Time',

        // Step 2
        labelDate: 'Select Date',
        calendarInfo: 'Select a date to see available time slots',
        availableTimesHeader: 'Available Times',
        btnStep2Back: 'Back',
        btnNext2: 'Next: Your Details',
        loadingSlots: 'Loading available slots...',
        noSlotsAvailable: 'No available slots',
        noSlotsTryDifferent: 'Please try selecting a different date',
        errorLoadingSlots: 'Error loading slots',

        // Step 3
        summaryTitle: 'Appointment Summary',
        summaryLabelService: 'Service:',
        summaryLabelDate: 'Date:',
        summaryLabelTime: 'Time:',
        summaryLabelDuration: 'Duration:',
        labelName: 'Full Name',
        labelEmail: 'Email',
        labelPhone: 'Phone Number',
        labelNotes: 'Additional Notes',
        namePlaceholder: 'John Doe',
        emailPlaceholder: 'john@example.com',
        phonePlaceholder: '+1 (555) 123-4567',
        notesPlaceholder: 'Any special requests or information...',
        btnStep3Back: 'Back',
        btnSubmit: 'Book Appointment',

        // Messages
        selectService: 'Please select a service',
        selectTimeSlot: 'Please select a time slot',
        fillRequired: 'Please fill in all required fields',
        networkError: '❌ Network error. Please try again.',
      },
      he: {
        // Header
        headerTitle: '📅 קביעת תור',
        headerSubtitle: 'בחר תאריך ושעה המתאימים לך',
        langText: 'English',

        // Step 1
        labelService: 'בחר שירות',
        labelDuration: 'משך (דקות)',
        chooseService: 'בחר שירות...',
        therapySession: 'פגישת טיפול',
        consultation: 'ייעוץ',
        haircut: 'תספורת',
        hairStyling: 'עיצוב שיער',
        facialTreatment: 'טיפול פנים',
        massage: 'עיסוי',
        manicure: 'מניקור',
        pedicure: 'פדיקור',
        makeup: 'איפור',
        other: 'אחר',
        minutes: 'דקות',
        btnStep1Next: 'הבא: בחירת תאריך ושעה',

        // Step 2
        labelDate: 'בחר תאריך',
        calendarInfo: 'בחר תאריך כדי לראות זמנים פנויים',
        availableTimesHeader: 'שעות פנויות',
        btnStep2Back: 'חזור',
        btnNext2: 'הבא: הפרטים שלך',
        loadingSlots: 'טוען זמנים פנויים...',
        noSlotsAvailable: 'אין זמנים פנויים',
        noSlotsTryDifferent: 'נסה לבחור תאריך אחר',
        errorLoadingSlots: 'שגיאה בטעינת הזמנים',

        // Step 3
        summaryTitle: 'סיכום התור',
        summaryLabelService: 'שירות:',
        summaryLabelDate: 'תאריך:',
        summaryLabelTime: 'שעה:',
        summaryLabelDuration: 'משך:',
        labelName: 'שם מלא',
        labelEmail: 'אימייל',
        labelPhone: 'מספר טלפון',
        labelNotes: 'הערות נוספות',
        namePlaceholder: 'ישראל ישראלי',
        emailPlaceholder: 'israel@example.com',
        phonePlaceholder: '050-1234567',
        notesPlaceholder: 'בקשות מיוחדות או מידע נוסף...',
        btnStep3Back: 'חזור',
        btnSubmit: 'אשר תור',

        // Messages
        selectService: 'אנא בחר שירות',
        selectTimeSlot: 'אנא בחר שעה',
        fillRequired: 'אנא מלא את כל השדות הנדרשים',
        networkError: '❌ שגיאת רשת. נסה שוב.',
      }
    };

    let currentLang = localStorage.getItem('preferredLanguage') || 'en';
    let currentStep = 1;
    let selectedSlot = null;

    // Initialize language on page load
    document.addEventListener('DOMContentLoaded', () => {
      applyLanguage(currentLang);
    });

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'he' : 'en';
      localStorage.setItem('preferredLanguage', currentLang);
      applyLanguage(currentLang);
    }

    function applyLanguage(lang) {
      const t = translations[lang];

      // Set direction
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      document.documentElement.lang = lang === 'he' ? 'he' : 'en';
      document.body.dir = lang === 'he' ? 'rtl' : 'ltr';

      // Update all text elements
      Object.keys(t).forEach(key => {
        const element = document.getElementById(key);
        if (element) {
          if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
            element.placeholder = t[key];
          } else {
            element.textContent = t[key];
          }
        }
      });

      // Update placeholders
      document.querySelectorAll('[data-placeholder-key]').forEach(el => {
        const key = el.getAttribute('data-placeholder-key');
        if (t[key]) {
          el.placeholder = t[key];
        }
      });

      // Update select options text (keeping emojis and duration)
      updateSelectOptions();
    }

    function updateSelectOptions() {
      const t = translations[currentLang];
      const serviceSelect = document.getElementById('service_type');

      // Update service options
      const services = [
        { value: '', emoji: '', key: 'chooseService', time: '' },
        { value: 'Therapy Session', emoji: '💬', key: 'therapySession', time: '(60 min)' },
        { value: 'Consultation', emoji: '🗣️', key: 'consultation', time: '(30 min)' },
        { value: 'Haircut', emoji: '✂️', key: 'haircut', time: '(45 min)' },
        { value: 'Hair Styling', emoji: '💇', key: 'hairStyling', time: '(60 min)' },
        { value: 'Facial Treatment', emoji: '✨', key: 'facialTreatment', time: '(60 min)' },
        { value: 'Massage', emoji: '💆', key: 'massage', time: '(90 min)' },
        { value: 'Manicure', emoji: '💅', key: 'manicure', time: '(45 min)' },
        { value: 'Pedicure', emoji: '🦶', key: 'pedicure', time: '(60 min)' },
        { value: 'Makeup', emoji: '💄', key: 'makeup', time: '(45 min)' },
        { value: 'Other', emoji: '📋', key: 'other', time: '(60 min)' }
      ];

      const currentValue = serviceSelect.value;
      serviceSelect.innerHTML = services.map(s =>
        `<option value="${s.value}">${s.emoji} ${t[s.key]} ${s.time}</option>`
      ).join('');
      serviceSelect.value = currentValue;

      // Update duration options
      const durationSelect = document.getElementById('duration');
      const currentDuration = durationSelect.value;
      const durations = [30, 45, 60, 90, 120];
      durationSelect.innerHTML = durations.map(d =>
        `<option value="${d}">${d} ${t.minutes}</option>`
      ).join('');
      durationSelect.value = currentDuration;
    }

    // Set minimum date to today
    const dateInput = document.getElementById('requested_date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;

    // Auto-set duration based on service type
    document.getElementById('service_type').addEventListener('change', (e) => {
      const service = e.target.value;
      const durationMap = {
        'Consultation': 30,
        'Haircut': 45,
        'Manicure': 45,
        'Makeup': 45,
        'Hair Styling': 60,
        'Therapy Session': 60,
        'Facial Treatment': 60,
        'Pedicure': 60,
        'Massage': 90
      };

      const duration = durationMap[service] || 60;
      document.getElementById('duration').value = duration;
    });

    function goToStep(step) {
      const t = translations[currentLang];

      // Validation
      if (step === 2 && currentStep === 1) {
        const service = document.getElementById('service_type').value;
        if (!service) {
          showMessage(t.selectService, 'error');
          return;
        }
      }

      if (step === 3 && currentStep === 2) {
        if (!selectedSlot) {
          showMessage(t.selectTimeSlot, 'error');
          return;
        }
        updateSummary();
      }

      // Hide all steps
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.step-dot').forEach(d => d.classList.remove('active'));

      // Show current step
      document.getElementById(`step${step}`).classList.add('active');
      document.querySelector(`.step-dot[data-step="${step}"]`).classList.add('active');

      currentStep = step;
      hideMessage();
    }

    async function loadAvailableSlots() {
      const t = translations[currentLang];
      const date = document.getElementById('requested_date').value;
      const duration = document.getElementById('duration').value;

      if (!date) return;

      const container = document.getElementById('slotsContainer');
      const content = document.getElementById('slotsContent');

      container.style.display = 'block';
      content.innerHTML = `<div class="loading"><div class="spinner"></div><p>${t.loadingSlots}</p></div>`;

      try {
        const response = await fetch(`/api/available-slots?date=${date}&duration=${duration}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to load slots');
        }

        // Update date display
        const dateObj = new Date(date + 'T00:00:00');
        const dateFormat = currentLang === 'he' ? 'he-IL' : 'en-US';
        document.getElementById('selectedDate').textContent = dateObj.toLocaleDateString(dateFormat, {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        if (data.slots.length === 0) {
          content.innerHTML = `
            <div class="no-slots">
              <div class="no-slots-icon">📅</div>
              <h3>${t.noSlotsAvailable}</h3>
              <p>${t.noSlotsTryDifferent}</p>
            </div>
          `;
        } else {
          const slotsHTML = data.slots.map(slot => `
            <button type="button" class="slot-button" onclick="selectSlot('${slot.time}', '${slot.display}')" data-time="${slot.time}">
              ${slot.display}
            </button>
          `).join('');

          content.innerHTML = `<div class="slots-grid">${slotsHTML}</div>`;
        }

        selectedSlot = null;
        document.getElementById('btnNext2').disabled = true;
      } catch (error) {
        content.innerHTML = `
          <div class="no-slots">
            <div class="no-slots-icon">⚠️</div>
            <h3>${t.errorLoadingSlots}</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    function selectSlot(time, display) {
      // Remove previous selection
      document.querySelectorAll('.slot-button').forEach(btn => btn.classList.remove('selected'));

      // Select new slot
      event.target.classList.add('selected');
      selectedSlot = { time, display };

      // Enable next button
      document.getElementById('btnNext2').disabled = false;
    }

    function updateSummary() {
      const service = document.getElementById('service_type').value;
      const date = document.getElementById('requested_date').value;
      const duration = document.getElementById('duration').value;

      const dateObj = new Date(date + 'T00:00:00');
      const dateFormat = currentLang === 'he' ? 'he-IL' : 'en-US';

      document.getElementById('summaryService').textContent = service;
      document.getElementById('summaryDate').textContent = dateObj.toLocaleDateString(dateFormat, {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('summaryTime').textContent = selectedSlot.display;
      document.getElementById('summaryDuration').textContent = `${duration} ${translations[currentLang].minutes}`;
    }

    async function submitAppointment() {
      const t = translations[currentLang];
      const name = document.getElementById('client_name').value;
      const email = document.getElementById('client_email').value;

      if (!name || !email) {
        showMessage(t.fillRequired, 'error');
        return;
      }

      const data = {
        client_name: name,
        client_email: email,
        client_phone: document.getElementById('client_phone').value,
        service_type: document.getElementById('service_type').value,
        requested_date: document.getElementById('requested_date').value,
        requested_time: selectedSlot.time,
        duration: parseInt(document.getElementById('duration').value),
        notes: document.getElementById('notes').value
      };

      try {
        const response = await fetch('/api/appointments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          showMessage('✅ ' + result.message, 'success');
          setTimeout(() => location.reload(), 3000);
        } else {
          showMessage('❌ ' + (result.error || 'Something went wrong'), 'error');
        }
      } catch (error) {
        showMessage(t.networkError, 'error');
      }
    }

    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }
  </script>
</body>
</html>

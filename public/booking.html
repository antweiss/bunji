<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    label .required {
      color: #e74c3c;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .service-icon {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Book an Appointment</h1>
    <p class="subtitle">Fill out the form below and we'll get back to you shortly with confirmation.</p>

    <div id="message" class="message"></div>

    <form id="bookingForm">
      <div class="form-group">
        <label for="client_name">Full Name <span class="required">*</span></label>
        <input type="text" id="client_name" name="client_name" required placeholder="John Doe">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="client_email">Email <span class="required">*</span></label>
          <input type="email" id="client_email" name="client_email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label for="client_phone">Phone Number</label>
          <input type="tel" id="client_phone" name="client_phone" placeholder="+1 (555) 123-4567">
        </div>
      </div>

      <div class="form-group">
        <label for="service_type">Service Type <span class="required">*</span></label>
        <select id="service_type" name="service_type" required>
          <option value="">Select a service...</option>
          <option value="Therapy Session">💬 Therapy Session</option>
          <option value="Consultation">🗣️ Consultation</option>
          <option value="Haircut">✂️ Haircut</option>
          <option value="Hair Styling">💇 Hair Styling</option>
          <option value="Facial Treatment">✨ Facial Treatment</option>
          <option value="Massage">💆 Massage</option>
          <option value="Manicure">💅 Manicure</option>
          <option value="Pedicure">🦶 Pedicure</option>
          <option value="Makeup">💄 Makeup</option>
          <option value="Other">📋 Other</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="requested_date">Preferred Date <span class="required">*</span></label>
          <input type="date" id="requested_date" name="requested_date" required>
        </div>

        <div class="form-group">
          <label for="requested_time">Preferred Time <span class="required">*</span></label>
          <input type="time" id="requested_time" name="requested_time" required>
        </div>
      </div>

      <div class="form-group">
        <label for="duration">Duration (minutes) <span class="required">*</span></label>
        <select id="duration" name="duration" required>
          <option value="30">30 minutes</option>
          <option value="60" selected>60 minutes</option>
          <option value="90">90 minutes</option>
          <option value="120">120 minutes</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Additional Notes</label>
        <textarea id="notes" name="notes" placeholder="Any special requests or information we should know..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Book Appointment</button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px; color: #666;">Submitting your request...</p>
      </div>
    </form>
  </div>

  <script>
    // Set minimum date to today
    const dateInput = document.getElementById('requested_date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;

    // Handle form submission
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form);
      const data = {};

      formData.forEach((value, key) => {
        data[key] = value;
      });

      // Convert duration to integer
      data.duration = parseInt(data.duration);

      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const messageDiv = document.getElementById('message');

      // Show loading
      submitBtn.disabled = true;
      loading.classList.add('active');
      messageDiv.style.display = 'none';

      try {
        const response = await fetch('/api/appointments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        });

        const result = await response.json();

        if (response.ok) {
          messageDiv.className = 'message success';
          messageDiv.textContent = '✅ ' + result.message;
          messageDiv.style.display = 'block';
          form.reset();

          // Scroll to message
          messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = '❌ ' + (result.error || 'Something went wrong. Please try again.');
          messageDiv.style.display = 'block';
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Network error. Please check your connection and try again.';
        messageDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        loading.classList.remove('active');
      }
    });
  </script>
</body>
</html>

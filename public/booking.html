<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 40px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 40px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e0e0e0;
      transition: all 0.3s;
    }

    .step-dot.active {
      background: #667eea;
      transform: scale(1.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    label .required {
      color: #e74c3c;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .date-picker-container {
      max-width: 400px;
      margin: 0 auto;
    }

    .calendar-info {
      text-align: center;
      color: #666;
      margin-top: 15px;
      font-size: 14px;
    }

    .slots-container {
      margin-top: 30px;
    }

    .slots-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .slots-header h3 {
      color: #333;
      margin-bottom: 5px;
    }

    .slots-date {
      color: #667eea;
      font-size: 16px;
      font-weight: 600;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .slot-button {
      padding: 12px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .slot-button:hover {
      border-color: #667eea;
      background: #f0f4ff;
      transform: translateY(-2px);
    }

    .slot-button.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .no-slots {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .no-slots-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .summary {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .summary h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .summary-label {
      color: #666;
      font-weight: 500;
    }

    .summary-value {
      color: #333;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .content {
        padding: 20px;
      }

      .slots-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📅 Book an Appointment</h1>
      <p>Select a date and time that works for you</p>
    </div>

    <div class="content">
      <div class="step-indicator">
        <div class="step-dot active" data-step="1"></div>
        <div class="step-dot" data-step="2"></div>
        <div class="step-dot" data-step="3"></div>
      </div>

      <div id="message" class="message"></div>

      <!-- Step 1: Service Selection -->
      <div class="step active" id="step1">
        <div class="form-group">
          <label for="service_type">Select Service <span class="required">*</span></label>
          <select id="service_type" name="service_type" required>
            <option value="">Choose a service...</option>
            <option value="Therapy Session">💬 Therapy Session (60 min)</option>
            <option value="Consultation">🗣️ Consultation (30 min)</option>
            <option value="Haircut">✂️ Haircut (45 min)</option>
            <option value="Hair Styling">💇 Hair Styling (60 min)</option>
            <option value="Facial Treatment">✨ Facial Treatment (60 min)</option>
            <option value="Massage">💆 Massage (90 min)</option>
            <option value="Manicure">💅 Manicure (45 min)</option>
            <option value="Pedicure">🦶 Pedicure (60 min)</option>
            <option value="Makeup">💄 Makeup (45 min)</option>
            <option value="Other">📋 Other (60 min)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="duration">Duration (minutes) <span class="required">*</span></label>
          <select id="duration" name="duration" required>
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60" selected>60 minutes</option>
            <option value="90">90 minutes</option>
            <option value="120">120 minutes</option>
          </select>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-primary" onclick="goToStep(2)">Next: Select Date & Time</button>
        </div>
      </div>

      <!-- Step 2: Date & Time Selection -->
      <div class="step" id="step2">
        <div class="date-picker-container">
          <div class="form-group">
            <label for="requested_date">Select Date <span class="required">*</span></label>
            <input type="date" id="requested_date" name="requested_date" required onchange="loadAvailableSlots()">
            <p class="calendar-info">Select a date to see available time slots</p>
          </div>
        </div>

        <div class="slots-container" id="slotsContainer" style="display: none;">
          <div class="slots-header">
            <h3>Available Times</h3>
            <p class="slots-date" id="selectedDate"></p>
          </div>
          <div id="slotsContent">
            <!-- Slots will be loaded here -->
          </div>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="goToStep(1)">Back</button>
          <button type="button" class="btn btn-primary" id="btnNext2" onclick="goToStep(3)" disabled>Next: Your Details</button>
        </div>
      </div>

      <!-- Step 3: Personal Information -->
      <div class="step" id="step3">
        <div class="summary">
          <h3>Appointment Summary</h3>
          <div class="summary-item">
            <span class="summary-label">Service:</span>
            <span class="summary-value" id="summaryService">-</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Date:</span>
            <span class="summary-value" id="summaryDate">-</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Time:</span>
            <span class="summary-value" id="summaryTime">-</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Duration:</span>
            <span class="summary-value" id="summaryDuration">-</span>
          </div>
        </div>

        <div class="form-group">
          <label for="client_name">Full Name <span class="required">*</span></label>
          <input type="text" id="client_name" name="client_name" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="client_email">Email <span class="required">*</span></label>
          <input type="email" id="client_email" name="client_email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label for="client_phone">Phone Number</label>
          <input type="tel" id="client_phone" name="client_phone" placeholder="+1 (555) 123-4567">
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes</label>
          <textarea id="notes" name="notes" placeholder="Any special requests or information..."></textarea>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="goToStep(2)">Back</button>
          <button type="button" class="btn btn-primary" onclick="submitAppointment()">Book Appointment</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    let selectedSlot = null;

    // Set minimum date to today
    const dateInput = document.getElementById('requested_date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;

    // Auto-set duration based on service type
    document.getElementById('service_type').addEventListener('change', (e) => {
      const service = e.target.value;
      const durationMap = {
        'Consultation': 30,
        'Haircut': 45,
        'Manicure': 45,
        'Makeup': 45,
        'Hair Styling': 60,
        'Therapy Session': 60,
        'Facial Treatment': 60,
        'Pedicure': 60,
        'Massage': 90
      };

      const duration = durationMap[service] || 60;
      document.getElementById('duration').value = duration;
    });

    function goToStep(step) {
      // Validation
      if (step === 2 && currentStep === 1) {
        const service = document.getElementById('service_type').value;
        if (!service) {
          showMessage('Please select a service', 'error');
          return;
        }
      }

      if (step === 3 && currentStep === 2) {
        if (!selectedSlot) {
          showMessage('Please select a time slot', 'error');
          return;
        }
        updateSummary();
      }

      // Hide all steps
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.step-dot').forEach(d => d.classList.remove('active'));

      // Show current step
      document.getElementById(`step${step}`).classList.add('active');
      document.querySelector(`.step-dot[data-step="${step}"]`).classList.add('active');

      currentStep = step;
      hideMessage();
    }

    async function loadAvailableSlots() {
      const date = document.getElementById('requested_date').value;
      const duration = document.getElementById('duration').value;

      if (!date) return;

      const container = document.getElementById('slotsContainer');
      const content = document.getElementById('slotsContent');

      container.style.display = 'block';
      content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading available slots...</p></div>';

      try {
        const response = await fetch(`/api/available-slots?date=${date}&duration=${duration}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to load slots');
        }

        // Update date display
        document.getElementById('selectedDate').textContent = new Date(date).toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        if (data.slots.length === 0) {
          content.innerHTML = `
            <div class="no-slots">
              <div class="no-slots-icon">📅</div>
              <h3>No available slots</h3>
              <p>Please try selecting a different date</p>
            </div>
          `;
        } else {
          const slotsHTML = data.slots.map(slot => `
            <button type="button" class="slot-button" onclick="selectSlot('${slot.time}', '${slot.display}')" data-time="${slot.time}">
              ${slot.display}
            </button>
          `).join('');

          content.innerHTML = `<div class="slots-grid">${slotsHTML}</div>`;
        }

        selectedSlot = null;
        document.getElementById('btnNext2').disabled = true;
      } catch (error) {
        content.innerHTML = `
          <div class="no-slots">
            <div class="no-slots-icon">⚠️</div>
            <h3>Error loading slots</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    function selectSlot(time, display) {
      // Remove previous selection
      document.querySelectorAll('.slot-button').forEach(btn => btn.classList.remove('selected'));

      // Select new slot
      event.target.classList.add('selected');
      selectedSlot = { time, display };

      // Enable next button
      document.getElementById('btnNext2').disabled = false;
    }

    function updateSummary() {
      const service = document.getElementById('service_type').value;
      const date = document.getElementById('requested_date').value;
      const duration = document.getElementById('duration').value;

      document.getElementById('summaryService').textContent = service;
      document.getElementById('summaryDate').textContent = new Date(date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('summaryTime').textContent = selectedSlot.display;
      document.getElementById('summaryDuration').textContent = `${duration} minutes`;
    }

    async function submitAppointment() {
      const name = document.getElementById('client_name').value;
      const email = document.getElementById('client_email').value;

      if (!name || !email) {
        showMessage('Please fill in all required fields', 'error');
        return;
      }

      const data = {
        client_name: name,
        client_email: email,
        client_phone: document.getElementById('client_phone').value,
        service_type: document.getElementById('service_type').value,
        requested_date: document.getElementById('requested_date').value,
        requested_time: selectedSlot.time,
        duration: parseInt(document.getElementById('duration').value),
        notes: document.getElementById('notes').value
      };

      try {
        const response = await fetch('/api/appointments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          showMessage('✅ ' + result.message, 'success');
          // Reset form after 3 seconds
          setTimeout(() => {
            location.reload();
          }, 3000);
        } else {
          showMessage('❌ ' + (result.error || 'Something went wrong'), 'error');
        }
      } catch (error) {
        showMessage('❌ Network error. Please try again.', 'error');
      }
    }

    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }
  </script>
</body>
</html>
